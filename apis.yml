name: Rothys
description: >-
  Rothy's is a San Francisco-based direct-to-consumer footwear and accessories
  brand founded in 2012, known for washable shoes and bags 3D-knitted from
  recycled materials such as post-consumer plastic water bottles and marine
  plastics. Its catalog spans flats, loafers, sneakers, Mary Janes, clogs,
  sandals, heels, and boots for women, men, and kids, alongside totes,
  crossbody bags, wallets, and backpacks. The company ships to 40+ countries
  and emphasizes sustainable, seamless-knit manufacturing that reduces waste.
  Rothy's was surfaced as a portfolio company of Lightspeed Venture Partners and
  added to the API Evangelist network. As a consumer retail brand it publishes
  no public developer API, developer portal, or machine-readable API surface;
  this profile captures its identity and web presence for the catalog.
